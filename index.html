<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULT AR Dashboard</title>
    <!-- 引入 Chart.js 方便未來直接畫圖表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        h1 {
            color: #0078d4;
            text-align: center;
            margin-bottom: 30px;
        }

        #status {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 16px;
            color: #666;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #0078d4;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>

    <h1>ULT 應收帳款 Dashboard</h1>
    
    <div id="status">正在載入最新應收帳款資料...</div>

    <div class="card">
        <h3>目前應收帳款列表</h3>
        <table id="arTable">
            <thead>
                <tr>
                    <th>客戶名稱</th>
                    <th>發票號碼</th>
                    <th>發票日期</th>
                    <th>應收餘額</th>
                    <th>預計收款日</th>
                </tr>
            </thead>
            <tbody>
                <!-- 資料會自動填入這裡 -->
            </tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // 請將下方網址替換為你剛才透過 Power Automate
        // 產生的 ar-data.json 公開下載連結 (或 API 連結)
        // ==========================================
        const jsonUrl = "你的_ar-data.json_公開下載網址";

        async-function loadARData() {
            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) {
                    throw new Error('無法取得 AR 資料檔案 (HTTP 狀態碼: ' + response.status + ')');
                }
                
                const data = await response.json();
                console.log("成功取得 AR 資料：", data);

                document.getElementById("status").textContent = "✅ 資料已成功同步更新";

                const tbody = document.querySelector("#arTable tbody");
                tbody.innerHTML = ""; // 清空舊資料

                // 將每一筆資料塞入表格
                data.forEach(item => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${item['客戶名稱'] || ''}</td>
                        <td>${item['發票號碼'] || ''}</td>
                        <td>${item['發票日期'] || ''}</td>
                        <td>${Number(item['應收餘額'] || 0).toLocaleString()}</td>
                        <td>${item['預計收款日'] || ''}</td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error(error);
                document.getElementById("status").textContent = "❌ 載入失敗：" + error.message;
            }
        }

        loadARData();
    </script>

</body>

</html>
