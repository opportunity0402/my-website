<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>ULT AR Dashboard</title>
</head>

<body>

    <h1>ULT 應收帳款 Dashboard</h1>

    <h2>應收帳款總額：NT$ <span id="totalAR">0</span></h2>

    <h2>應收帳款明細</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>客戶名稱</th>
                <th>發票號碼</th>
                <th>發票日期</th>
                <th>應收餘額</th>
                <th>預計收款日</th>
            </tr>
        </thead>

        <tbody id="arTable">
        </tbody>
    </table>

    <script>

        fetch("AR TEST.csv")
            .then(response => response.text())
            .then(data => {

                const rows = data.trim().split("\n");

                let totalAR = 0;

                rows.slice(1).forEach(row => {

                    const columns = row.split(",");

                    totalAR += Number(columns[3]);

                    const tr = document.createElement("tr");

                    columns.forEach(column => {

                        const td = document.createElement("td");

                        td.textContent = column;

                        tr.appendChild(td);

                    });

                    document.getElementById("totalAR").textContent =
    totalAR.toLocaleString();

                });

            });

    </script>

</body>

</html>
