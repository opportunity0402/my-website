<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULT AR Dashboard</title>

    <script type="module">
        import {
            PublicClientApplication
        } from "https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.25.0/+esm";

        // ==============================
        // Microsoft Entra 設定
        // ==============================
        const msalConfig = {
            auth: {
                clientId: "2044b34d-062f-45c4-baa9-6ce31d947bc4",
                authority: "https://login.microsoftonline.com/b85a360e-e116-4ef7-95e9-29d00f48e352",
                redirectUri: "https://opportunity0402.github.io/my-website/redirect.html"
            },
            cache: {
                cacheLocation: "sessionStorage"
            }
        };

        const msalInstance = new PublicClientApplication(msalConfig);

        // 先只要求 Files.Read
        const loginRequest = {
    scopes: [
        "User.Read",
        "Files.ReadWrite"
            ]
        };

        // ==============================
        // 你的 SharePoint 分享連結
        // ==============================
        const shareUrl =
            "https://ultesttechcom.sharepoint.com/:x:/s/ULT_All/IQAOATO3Q7dKQaZpR0XhBD38AWfZEL6OHxVe2rQdkcLSvZc?e=GiQs4r";


        // ==============================
        // 初始化
        // ==============================
        async function initialize() {

            try {

                await msalInstance.initialize();

                document.getElementById("loginButton").disabled = false;

                document
                    .getElementById("loginButton")
                    .addEventListener("click", login);

                document.getElementById("status").textContent =
                    "Microsoft 登入系統已準備完成";

            } catch (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "MSAL 初始化失敗：" + error.message;
            }
        }


        // ==============================
        // 登入
        // ==============================
        async function login() {

            try {

                document.getElementById("status").textContent =
                    "正在登入 Microsoft 365...";

                const response =
                    await msalInstance.loginPopup(loginRequest);

                const account = response.account;

                msalInstance.setActiveAccount(account);

                document.getElementById("status").textContent =
                    "Microsoft 365 登入成功";

                document.getElementById("userInfo").innerHTML =
                    "登入帳號：<strong>" +
                    account.username +
                    "</strong>";

                document.getElementById("loginButton").style.display =
                    "none";

                document.getElementById("fileStatus").textContent =
                    "正在透過 SharePoint 分享連結尋找 Excel...";

                await getSharedFile(account);

            } catch (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "登入失敗：" +
                    (error.errorCode || error.message);
            }
        }


        // ==============================
        // 取得 Access Token
        // ==============================
        async function getAccessToken(account) {

            const request = {
    scopes: [
        "User.Read",
        "Files.Read"
    ],
    account: account
            };

            try {

                const response =
                    await msalInstance.acquireTokenSilent(request);

                return response.accessToken;

            } catch (error) {

                console.log(
                    "Silent token failed, using popup",
                    error
                );

                const response =
                    await msalInstance.acquireTokenPopup(request);

                return response.accessToken;
            }
        }


        // ==============================
        // SharePoint URL
        // 轉成 Graph shareId
        // ==============================
        function encodeSharingUrl(url) {

            const bytes =
                new TextEncoder().encode(url);

            let binary = "";

            bytes.forEach(byte => {
                binary += String.fromCharCode(byte);
            });

            const base64 =
                btoa(binary);

            return "u!" +
                base64
                    .replace(/=/g, "")
                    .replace(/\//g, "_")
                    .replace(/\+/g, "-");
        }


        // ==============================
        // 用分享網址取得 Excel
        // ==============================
        async function getSharedFile(account) {

            try {

                const token =
                    await getAccessToken(account);

                const shareId =
                    encodeSharingUrl(shareUrl);

                console.log(
                    "Graph shareId:",
                    shareId
                );

                const graphUrl =
                    "https://graph.microsoft.com/v1.0/shares/" +
                    shareId +
                    "/driveItem";


                const response = await fetch(
                    graphUrl,
                    {
                        headers: {
                            Authorization:
                                "Bearer " + token
                        }
                    }
                );


                const responseText =
                    await response.text();


                if (!response.ok) {

                    throw new Error(
                        "Graph API 回傳 " +
                        response.status +
                        "：" +
                        responseText
                    );
                }


                const file =
                    JSON.parse(responseText);


                console.log(
                    "SharePoint Excel:",
                    file
                );


                document.getElementById("fileStatus").innerHTML =
                    "✅ SharePoint Excel 連線成功";


                document.getElementById("fileInfo").innerHTML =
                    "<strong>找到 AR Excel！</strong>" +
                    "<br><br>" +

                    "檔案名稱：<strong>" +
                    file.name +
                    "</strong><br>" +

                    "檔案大小：" +
                    (file.size / 1024 / 1024).toFixed(2) +
                    " MB<br>" +

                    "最後修改：" +
                    new Date(
                        file.lastModifiedDateTime
                    ).toLocaleString() +
                    "<br><br>" +

                    "Drive Item ID：<br>" +
                    "<code>" +
                    file.id +
                    "</code>";

            } catch (error) {

                console.error(error);

                document.getElementById("fileStatus").innerHTML =
                    "❌ SharePoint Excel 連線失敗";

                document.getElementById("fileInfo").textContent =
                    error.message;
            }
        }


        initialize();

    </script>


    <style>

        body {
            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;

            max-width: 1100px;

            margin: 40px auto;

            padding: 0 20px;
        }


        button {

            background: #0078d4;

            color: white;

            border: 0;

            padding: 12px 22px;

            font-size: 16px;

            border-radius: 5px;

            cursor: pointer;
        }


        button:disabled {

            background: #999;

            cursor: wait;
        }


        #status {

            margin-top: 20px;

            font-weight: bold;
        }


        #userInfo {

            margin-top: 10px;
        }


        #sharepointBox {

            margin-top: 30px;

            padding: 20px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: #f7f7f7;
        }


        #fileStatus {

            font-size: 18px;

            font-weight: bold;
        }


        #fileInfo {

            margin-top: 15px;

            line-height: 1.7;

            word-break: break-all;
        }

    </style>

</head>


<body>

    <h1>ULT 應收帳款 Dashboard</h1>

    <p>
        請使用優立測 Microsoft 365 帳號登入。
    </p>


    <button id="loginButton" disabled>
        Microsoft 365 登入
    </button>


    <div id="status">
        正在初始化 Microsoft 登入...
    </div>


    <div id="userInfo"></div>


    <div id="sharepointBox">

        <div id="fileStatus">
            尚未連線 SharePoint
        </div>

        <div id="fileInfo"></div>

    </div>

</body>

</html>
