<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>我的第一個網站</title>
</head>

<body>

    <h1>歡迎來到我的網站</h1>

    <img src="gumgum.jpg" width="500">

    <p id="message"></p>

    <script>
        function updateTime() {
            const now = new Date();

            const time = now.toLocaleTimeString("zh-TW", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });

            document.getElementById("message").innerText =
                "此時此刻是 " + time + "，我正在吃口香糖。";
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>

</html>
