<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULT AR Dashboard</title>

    <script type="module">
        import {
            PublicClientApplication
        } from "https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.25.0/+esm";

        const msalConfig = {
            auth: {
                clientId: "2044b34d-062f-45c4-baa9-6ce31d947bc4",
                authority: "https://login.microsoftonline.com/b85a360e-e116-4ef7-95e9-29d00f48e352",
                redirectUri: "https://opportunity0402.github.io/my-website/redirect.html"
            },
            cache: {
                cacheLocation: "sessionStorage"
            }
        };

        const msalInstance = new PublicClientApplication(msalConfig);

        const loginRequest = {
    scopes: [
        "User.Read",
        "Files.Read.All"
    ]
};

        async function initialize() {
            try {
                await msalInstance.initialize();

                document.getElementById("loginButton").disabled = false;

                document.getElementById("loginButton").addEventListener(
                    "click",
                    login
                );

            } catch (error) {
                console.error(error);

                document.getElementById("status").textContent =
                    "MSAL 初始化失敗：" + error.message;
            }
        }


        async function login() {

            try {

                document.getElementById("status").textContent =
                    "正在登入 Microsoft 365...";

                const response =
                    await msalInstance.loginPopup(loginRequest);

                const account = response.account;

                msalInstance.setActiveAccount(account);

                document.getElementById("status").textContent =
                    "Microsoft 365 登入成功";

                document.getElementById("userInfo").innerHTML =
                    "登入帳號：<strong>" +
                    account.username +
                    "</strong>";

                document.getElementById("loginButton").style.display =
                    "none";

                document.getElementById("fileStatus").textContent =
                    "正在尋找 ULT AR Excel...";

                await findARFile(account);

            } catch (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "登入失敗：" + error.message;
            }
        }


        async function getAccessToken(account) {

            const request = {
                scopes: [
                    "User.Read",
                    "Files.Read"
                ],
                account: account
            };

            try {

                const response =
                    await msalInstance.acquireTokenSilent(request);

                return response.accessToken;

            } catch (error) {

                console.log(
                    "Silent token failed, using popup",
                    error
                );

                const response =
                    await msalInstance.acquireTokenPopup(request);

                return response.accessToken;
            }
        }


        async function findARFile(account) {

            try {

                const token =
                    await getAccessToken(account);

                /*
                    SharePoint 網址：

                    https://ultesttechcom.sharepoint.com
                    /sites/ULT_All
                */

                const siteResponse = await fetch(
                    "https://graph.microsoft.com/v1.0/sites/ultesttechcom.sharepoint.com:/sites/ULT_All",
                    {
                        headers: {
                            Authorization: "Bearer " + token
                        }
                    }
                );

                if (!siteResponse.ok) {
                    throw new Error(
                        "取得 SharePoint Site 失敗：" +
                        siteResponse.status +
                        " " +
                        await siteResponse.text()
                    );
                }

                const site =
                    await siteResponse.json();

                console.log(
                    "SharePoint Site:",
                    site
                );


                /*
                    找到 ULT_All 的 Documents 文件庫
                */

                const driveResponse = await fetch(
                    "https://graph.microsoft.com/v1.0/sites/" +
                    site.id +
                    "/drive",
                    {
                        headers: {
                            Authorization: "Bearer " + token
                        }
                    }
                );

                if (!driveResponse.ok) {
                    throw new Error(
                        "取得 SharePoint 文件庫失敗：" +
                        driveResponse.status +
                        " " +
                        await driveResponse.text()
                    );
                }

                const drive =
                    await driveResponse.json();

                console.log(
                    "SharePoint Drive:",
                    drive
                );


                /*
                    正式 ULT AR Excel 路徑
                */

                const filePath =
                    "/OPS/Special Case/ULT_Part time/Fin related/" +
                    "開立發票申請/" +
                    "2025_ULT開立發票明細(new).xlsx";


                const fileURL =
                    "https://graph.microsoft.com/v1.0/drives/" +
                    drive.id +
                    "/root:" +
                    filePath;


                const fileResponse = await fetch(
                    fileURL,
                    {
                        headers: {
                            Authorization: "Bearer " + token
                        }
                    }
                );


                if (!fileResponse.ok) {

                    throw new Error(
                        "找不到 AR Excel：" +
                        fileResponse.status +
                        " " +
                        await fileResponse.text()
                    );
                }


                const file =
                    await fileResponse.json();


                console.log(
                    "AR Excel:",
                    file
                );


                document.getElementById("fileStatus").innerHTML =
                    "✅ 已成功連線 SharePoint";


                document.getElementById("fileInfo").innerHTML =
                    "<strong>找到 AR Excel！</strong><br><br>" +
                    "檔案名稱：" +
                    file.name +
                    "<br>" +
                    "檔案大小：" +
                    (file.size / 1024 / 1024).toFixed(2) +
                    " MB<br>" +
                    "最後修改：" +
                    new Date(file.lastModifiedDateTime).toLocaleString();

            } catch (error) {

                console.error(error);

                document.getElementById("fileStatus").innerHTML =
                    "❌ SharePoint 連線失敗";

                document.getElementById("fileInfo").textContent =
                    error.message;
            }
        }


        initialize();

    </script>


    <style>

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        button {
            background: #0078d4;
            color: white;
            border: 0;
            padding: 12px 22px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: wait;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        #userInfo {
            margin-top: 10px;
        }

        #sharepointBox {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f7f7f7;
        }

        #fileStatus {
            font-size: 18px;
            font-weight: bold;
        }

        #fileInfo {
            margin-top: 15px;
            line-height: 1.6;
        }

    </style>

</head>


<body>

    <h1>ULT 應收帳款 Dashboard</h1>

    <p>
        請使用優立測 Microsoft 365 帳號登入。
    </p>


    <button id="loginButton" disabled>
        Microsoft 365 登入
    </button>


    <div id="status">
        正在初始化 Microsoft 登入...
    </div>


    <div id="userInfo"></div>


    <div id="sharepointBox">

        <div id="fileStatus">
            尚未連線 SharePoint
        </div>

        <div id="fileInfo"></div>

    </div>

</body>

</html>
